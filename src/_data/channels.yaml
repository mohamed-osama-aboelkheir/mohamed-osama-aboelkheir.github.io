# ---------------------------------------------------------------------------
# "Watch, Read & Code".
#
# `featured` is the brand block: one logo with its platforms listed underneath.
# `more` is the row of single-destination cards below it.
#
#   icon   a file in src/img/logos/ (without .svg) — youtube, medium, github,
#          linkedin, google-drive, devto, skill. Monochrome ones automatically
#          swap to a light version in dark mode.
#   mark   fallback tile text when there is no icon
# ---------------------------------------------------------------------------

featured:
  name: AppSec Untangled
  logo: appsec-untangled-logo.jpg
  round: true
  description: >-
    Where I write and talk about application security — walkthroughs, series,
    and the thinking behind them.
  links:
    - name: YouTube
      icon: youtube
      url: https://www.youtube.com/@AppSecUntangled
    - name: Medium
      icon: medium
      url: https://medium.com/@mohamed.osama.aboelkheir
    - name: X
      icon: x
      url: https://x.com/AppsecUntangled

more:
  - name: dev.to
    description: Cross-posted articles and shorter write-ups
    url: https://dev.to/mohamed_aboelkheir
    mark: DEV
    mark_style: devto

  - name: GitHub
    description: Challenge apps, solutions, and the rest of the code
    url: https://github.com/mohamed-osama-aboelkheir
    icon: github
