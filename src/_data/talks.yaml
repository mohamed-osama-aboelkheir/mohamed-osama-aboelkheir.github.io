# ---------------------------------------------------------------------------
# Talks. One entry per TALK, with every conference it was given at nested
# under `appearances`. Sorted automatically: undated/upcoming first, then by
# most recent appearance — so file order does not matter.
#
# Per talk:
#   title, abstract
#   slug            short id for the share link: ?talk=<slug> pins this talk
#                   in a box at the top of the page. Add &at=<event-slug> (the
#                   event name lowercased and hyphenated, e.g. techbash-2026)
#                   to show only that venue's row. Defaults to the slugified
#                   title — set it explicitly so the URL/QR stays short.
#   logo            optional image in src/img/, shown beside the title
#   slides_url      canonical deck, used when an appearance has no override
#   recording_url   canonical recording, same idea
#   tags            optional short labels
#   links           optional list of {label, url} (e.g. a related blog post)
#
# Per appearance:
#   event           required
#   subtitle        optional — the title used at that venue, when it differed
#   event_url       optional link to the conference / schedule
#   logo            optional conference logo in src/img/, shown at the start
#                   of the row
#   logo_bg         tile colour behind that logo (default white) — set a dark
#                   one for logos drawn in white
#   location        optional
#   date            "YYYY-MM-DD" or "YYYY-MM". Omit entirely for "Date TBA".
#   status          "upcoming" to force the Upcoming badge
#   slides_url / recording_url / skill_url   links, with talk-level fallback
#   pending         resources promised but not published yet — any of
#                   [slides, video, skill]. Renders a muted "soon" chip with
#                   the right icon instead of a link. Delete a name from the
#                   list once you set the matching URL.
# ---------------------------------------------------------------------------

- title: 'Beyond STRIDE: The "Doors, Windows & Holes" Methodology for Threat Modeling Web Apps'
  slug: beyond-stride
  abstract: >-
    STRIDE tells you how to categorize threats, not where to find them. A
    65-minute workshop on the "Doors, Windows & Holes" method for finding every
    entry point of a web app, obvious and hidden, paired with a two-bucket
    model (business-logic controls vs. source-to-sink traces) to find threats
    and their mitigations, demonstrated live on a sample web app.
  tags:
    - Threat Modeling
    - Workshop
  appearances:
    - event: ThreatModCon San Francisco 2026
      event_url: https://www.threatmodcon.com/san-francisco-2026
      logo: threatmodcon-2026-logo.png
      logo_bg: "#000"
      location: San Francisco, CA, US
      date: "2026-11-07"

- title: "I Tested Different Prompt Injection Mitigations, Here Is What Actually Works"
  slug: prompt-injection
  abstract: >-
    Prompt injection mitigations, put to the test. An experiment comparing
    the common defenses against real injection attempts to see which ones
